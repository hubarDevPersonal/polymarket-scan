services:
  # ── Go Arbitrage Engine ──────────────────────────────────────────
  arb-engine:
    build: .
    container_name: pm-arb-engine
    ports:
      - "8080:8080"
    env_file: .env
    restart: unless-stopped
    # Note: distroless image has no shell/wget — use external monitoring
    # Health endpoint: GET /healthz

  # ── Node.js Orderbook Scanner ────────────────────────────────────
  scanner:
    build: ./scanner
    container_name: pm-scanner
    ports:
      - "3847:3847"
    env_file: ./scanner/.env
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_TABLE: scanner-audit
      DYNAMO_REGION: us-east-1
      AUDIT_ENABLED: "true"
    depends_on:
      clickhouse:
        condition: service_healthy
      dynamodb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3847/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── ClickHouse (historical data) ─────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: pm-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ── DynamoDB Local (audit log) ───────────────────────────────────
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: pm-dynamodb
    ports:
      - "127.0.0.1:8002:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb"]
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    restart: unless-stopped

volumes:
  clickhouse-data:
  dynamodb-data:
